name: Keep-alive

on:
  schedule:
    - cron: '0 6 1 * *'  # el día 1 de cada mes
  workflow_dispatch:      # permite lanzarlo manualmente para probar

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar marca de actividad
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep-alive (evita que GitHub desactive los workflows programados)" || exit 0
          git push
